services:
  forecast-api:
    build: .
    image: mozn-forecast:latest
    command: python -m uvicorn postprocessing.inference.api:app --host 0.0.0.0 --port ${FORECAST_API_PORT:-8000}
    env_file: .env
    environment:
      - FORECAST_DIR=/data/forecasts
    volumes:
      - forecast-data:/data/forecasts
    ports:
      - "127.0.0.1:${FORECAST_API_PORT:-8000}:${FORECAST_API_PORT:-8000}"
    restart: unless-stopped

  forecast-pipeline:
    build: .
    image: mozn-forecast:latest
    command: python scripts/inference/run_scheduler.py
    env_file: .env
    environment:
      - FORECAST_DIR=/data/forecasts
    volumes:
      - forecast-data:/data/forecasts
    restart: unless-stopped

volumes:
  forecast-data:
